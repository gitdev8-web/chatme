<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glow circle -->
  <circle cx="256" cy="240" r="180" fill="url(#glow-grad)"/>

  <!-- Main Chat Bubble -->
  <g filter="url(#shadow)">
    <path d="M140 180 C140 135 180 100 240 100 L272 100 C332 100 372 135 372 180 L372 260 C372 305 332 340 272 340 L216 340 L160 388 C152 395 140 389 140 378 L140 340 C140 340 140 330 140 320 Z" fill="url(#bubble-grad)"/>
    
    <!-- Waveform / Chat pulses inside bubble -->
    <rect x="195" y="200" width="18" height="40" rx="9" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="227" y="175" width="18" height="90" rx="9" fill="#ffffff"/>
    <rect x="259" y="190" width="18" height="60" rx="9" fill="#ffffff"/>
    <rect x="291" y="210" width="18" height="25" rx="9" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- Online Presence Dot -->
  <circle cx="365" cy="140" r="26" fill="#10b981" stroke="#0f172a" stroke-width="8"/>
  <circle cx="365" cy="140" r="14" fill="#6ee7b7"/>
</svg>
